<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동물농장 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DDF1EA;--card:#FFFFFF;--ink:#4A3B2A;--muted:#7D6E5B;--line:#E6D9C2;--accent:#F2A65A;--accent-ink:#4A2A08;--good:#7CC29A;--bad:#E58B8B;--bubble:#FFF7E6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2A27;--card:#26302D;--ink:#F3E9DA;--muted:#B9AA92;--line:#3A4742;--accent-ink:#2B1805;--good:#6DB38B;--bad:#D98080;--bubble:#33322B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B2A27;--card:#26302D;--ink:#F3E9DA;--muted:#B9AA92;--line:#3A4742;--accent-ink:#2B1805;--good:#6DB38B;--bad:#D98080;--bubble:#33322B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:440px;margin:0 auto;padding:16px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:26px;margin:0}
.coin{font-family:"Jua",sans-serif;font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font-size:15px;min-height:42px;padding:6px 2px;border-radius:14px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{border-radius:24px;padding:12px 12px 8px;border:2px solid var(--line);background:#C9E8F2 center bottom/cover no-repeat;min-height:330px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.bubble{background:var(--bubble);border:2px solid var(--line);border-radius:16px;padding:8px 12px;min-height:44px;font-size:15px;text-align:center}
.petbox{position:relative;height:224px;display:flex;align-items:flex-end;justify-content:center}
.wrapimg{position:relative;transform-origin:50% 100%}
.petbox img{display:block;max-width:none;transition:filter .3s}
.petbox.sulk img{filter:saturate(.55)}
.petbox.sulk .wrapimg{transform:rotate(-3deg)}
.petbox.sick img{filter:grayscale(.7) brightness(.95)}
.petbox.sleep img{filter:brightness(.8) saturate(.8)}
.petbox .em{position:absolute;right:-24px;top:-8px;font-size:26px;font-family:"Jua",sans-serif;color:#6F7FA8}
.petbox.bounce .wrapimg{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.petbox.bounce .wrapimg{animation:none}}
.info{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 4px}
.name{font-family:"Jua",sans-serif;font-size:22px}
.lv{font-family:"Jua",sans-serif;font-size:18px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;margin:6px 2px}
.row .lab{width:44px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.bar{flex:1;height:14px;border-radius:999px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.bar i.low{background:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font-family:"Jua",sans-serif;font-size:19px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:12px 8px;cursor:pointer;min-height:52px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.97)}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:1/-1}
button small{font-family:"Gowun Dodum",sans-serif;font-size:13px;opacity:.85;margin-left:4px}
.toy{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;padding:8px 4px;min-height:96px}
.toy img{height:40px;width:auto;max-width:56px;object-fit:contain}
.toy small{margin:0}
.hint{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;margin:0}
.tools{display:flex;gap:10px;margin-top:18px}
.tools button{flex:1;font-size:15px;min-height:44px;color:var(--muted)}
.note{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
.start{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 28px;display:flex}
.start[hidden]{display:none}
.start .in{max-width:440px;width:100%;margin:auto;text-align:center}
.start h2{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:8px 0 6px}
.start h1.logo{font-size:42px;margin:10px 0 6px}
.start p{margin:0 0 16px;color:var(--muted)}
.start .go{width:100%}
.start.title{background:linear-gradient(#96CDE9 0,#B9E0EE 40%,#7FB35C 78%,#5A753B 100%);padding:0}
.start.title .in{max-width:480px;width:100%;height:100%;margin:0 auto;cursor:pointer}
.start.title .scr{width:100%;height:100%}
.start.title .titleimg{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover;margin:0}
.start .heg{display:block;margin:10px auto 18px;height:230px;width:auto}
.start .scr[hidden]{display:none}
.start .titleimg{display:block;max-width:100%;max-height:50vh;margin:0 auto 18px}
.start .egg{display:block;margin:6px auto 18px;height:150px;width:auto}
.start .mys{font-size:90px;line-height:1;margin:14px 0 22px}
.start label{display:block;text-align:left;margin:0 2px 4px;color:var(--muted)}
.start input{width:100%;font-family:"Jua",sans-serif;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:14px}
.start .baby{display:block;margin:6px auto 14px;animation:pop .6s ease both}
.wob{animation:wob .5s ease-in-out infinite}
.flash{animation:flash .6s ease both}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(2.2)}100%{filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.wob,.start .baby,.flash{animation:none}}
</style>
</head>
<body>
<div class="start" id="start" hidden><div class="in">
  <div class="scr" id="sc1" role="button" tabindex="0" aria-label="화면을 터치하세요">
    <img class="titleimg" id="titleimg" alt="동물농장" hidden>
    <h1 class="logo" id="logo">마이 펫 팜</h1>
  </div>
  <div class="scr" id="sc2" hidden>
    <h2>친구 만나기</h2>
    <p>어떤 친구가 올까요?</p>
    <img class="heg" id="mys" alt="">
    <button class="main go" id="go2">랜덤으로 받기</button>
  </div>
  <div class="scr" id="sc3" hidden>
    <h2 id="t3">친구가 왔어요!</h2>
    <p>이름을 지어 주세요</p>
    <img class="heg" id="egg3" alt="">
    <label for="pname">이름</label>
    <input id="pname" maxlength="8" autocomplete="off" placeholder="이름을 입력하세요">
    <button class="main go" id="go3">이 이름으로 정했어요</button>
  </div>
  <div class="scr" id="sc4" hidden>
    <h2 id="t4">…</h2>
    <p id="p4">&nbsp;</p>
    <div id="hatch"></div>
    <button class="main go" id="go4" hidden>놀러 가기</button>
  </div>
</div></div>
<div class="wrap">
  <div class="top"><h1>동물농장 🐾</h1><div class="coin" id="coin"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="stage" id="stage">
    <div class="bubble" id="say"></div>
    <div class="petbox" id="pet"></div>
  </div>
  <div class="info"><span class="name" id="name"></span><span class="lv" id="lv"></span></div>
  <div class="row"><span class="lab">밥</span><div class="dots" id="dots"></div></div>
  <div class="row"><span class="lab">기분</span><div class="bar"><i id="mood"></i></div></div>
  <div class="row"><span class="lab">건강</span><div class="bar"><i id="health"></i></div></div>
  <div class="row"><span class="lab">청결</span><div class="bar"><i id="clean"></i></div></div>
  <div class="btns" id="acts"></div>
  <div class="tools">
    <button id="next">하루 지나기 (시험용)</button>
    <button id="reset">처음부터</button>
  </div>
  <p class="note">시험판이에요. 이 기기에만 저장돼요. 24시간마다 하루가 지나요.</p>
  <p class="note" id="remain"></p>
</div>

  var POOL=["rblue","siam","malt","shiba","hams","cheese","poodle"];
  var newPet="",timers=[];
  function scr(n){el("start").classList.toggle("title",n===1&&!!TITLE_IMG);for(var i=1;i<=4;i++)el("sc"+i).hidden=(i!==n);}
  function later(f,ms){timers.push(setTimeout(f,ms));}
  function buildStart(){
    timers.forEach(clearTimeout);timers=[];newPet="";
    el("pname").value="";el("mys").src=HATCH[0];el("go4").hidden=true;el("hatch").innerHTML="";
    if(TITLE_IMG){var ti=el("titleimg");ti.onerror=function(){ti.hidden=true;el("logo").hidden=false;};ti.src=TITLE_IMG;ti.hidden=false;el("logo").hidden=true;}
    scr(1);
  }
  el("sc1").onclick=function(){scr(2);};
  el("sc1").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();scr(2);}};
  el("go2").onclick=function(){
    var m=el("mys");el("go2").disabled=true;m.classList.add("wob");
    later(function(){
      m.classList.remove("wob");
      newPet=POOL[Math.floor(Math.random()*POOL.length)];
      el("egg3").src=HATCH[0];el("go2").disabled=false;scr(3);
      el("pname").focus();
    },1200);
  };
  el("go3").onclick=function(){
    var n=el("pname").value.trim();
    if(!n){el("pname").focus();return;}
    S.name=n;scr(4);
    el("t4").textContent="어, 알이 흔들려요!";el("p4").innerHTML="&nbsp;";
    var h=el("hatch");h.innerHTML='<img class="heg wob" alt="" src="'+HATCH[0]+'">';
    var im=h.firstChild;
    later(function(){im.src=HATCH[1];},700);
    later(function(){im.src=HATCH[2];},1300);
    later(function(){im.src=HATCH[3];im.className="heg flash";el("t4").textContent="앗, 알이 깨져요!";},1900);
    later(function(){
      var d=PETS[newPet][0];
      h.innerHTML='<img class="baby flash" alt="" src="'+d.src+'" width="'+Math.round(d.w*1.1)+'" height="'+Math.round(d.h*1.1)+'">';
      el("t4").textContent=n+"(이)가 태어났어요!";el("p4").textContent=PETNAME[newPet]+" 친구예요";
      el("go4").hidden=false;
    },2700);
  };
  el("go4").onclick=function(){
    S.pet=newPet;S.started=true;S.dayStart=Date.now();S.say="안녕! 나는 "+S.name+"이야. 밥 주세요!";
    sleeping=false;render();showRemain();
  };
  function render(){
    el("start").hidden=!!S.started;
    el("coin").textContent="🪙 "+S.coins;
    el("name").textContent=S.name+" · "+STAGE[stageIdx()];
    el("lv").textContent="Lv."+S.level+(S.level>=20?" (최대)":"");
    el("say").textContent=S.say;
    var bgk=sleeping?"night":S.place==="home"?"home":S.place;
    el("stage").style.backgroundImage="url("+BG[bgk]+")";
    var pb=el("pet");pb.innerHTML=petHtml();
    pb.classList.toggle("sick",S.health<40&&!sleeping);
    pb.classList.toggle("sulk",S.mood<30&&S.health>=40&&!sleeping);
    pb.classList.toggle("sleep",sleeping);
    var d="";for(var i=0;i<3;i++){d+='<span class="dot'+(i<S.food?' on':'')+'"></span>';}
    el("dots").innerHTML=d;
    [["mood",S.mood],["health",S.health],["clean",S.clean]].forEach(function(x){var b=el(x[0]);b.style.width=cl(x[1])+"%";b.className=x[1]<30?"low":"";});
    var t="";PLACES.forEach(function(x){t+='<button data-p="'+x[0]+'" class="'+(S.place===x[0]?"on":"")+'">'+x[1]+'</button>';});
    el("tabs").innerHTML=t;
    el("acts").innerHTML=actsHtml();
    save();
  }
  function act(fn){fn();render();hop();}
  var A={
    feed:function(){
      if(S.food>=3){say("오늘은 배가 불러요! 내일 또 주세요.");return;}
      if(S.stock<1){say("사료가 없어요. 사료집에서 사 오세요!");return;}
      S.stock--;S.food++;
      if(S.food>=3){
        if(S.level<20){S.level++;say("냠냠, 배불러요! Lv."+S.level+"이 됐어요!");}else{say("냠냠, 배불러요! 이미 최대 레벨이에요.");}
        S.mood=cl(S.mood+10);
      }else{say("냠냠! 맛있어요. ("+S.food+"/3)");}
    },
    pat:function(){S.mood=cl(S.mood+5);say("헤헤, 쓰다듬어 주니 좋아요.");},
    wash:function(){S.clean=100;S.mood=cl(S.mood+10);say("뽀득뽀득! 깨끗해졌어요.");},
    heal:function(){
      if(S.coins<300){say("코인이 모자라요.");return;}
      if(S.health>=100){say("선생님이 말했어요. 아주 건강하대요!");return;}
      S.coins-=300;S.health=100;say("진찰 끝! 이제 건강해요.");
    },
    buy:function(){
      if(S.coins<100){say("코인이 모자라요.");return;}
      S.coins-=100;S.stock++;say("사료를 샀어요. ("+S.stock+"개)");
    },
    toy:function(id){
      var t=TOYS.filter(function(x){return x[0]===id;})[0];
      if(!S.toys[id]){
        if(S.coins<t[2]){say("코인이 모자라요.");return;}
        S.coins-=t[2];S.toys[id]=1;say(t[1]+"을 샀어요! 이제 놀 수 있어요.");return;
      }
      S.mood=cl(S.mood+t[3]);say(t[1]+"(으)로 신나게 놀았어요!");
    }
  };
  el("acts").onclick=function(e){
    var b=e.target.closest("button");if(!b||!b.dataset.a)return;
    var a=b.dataset.a,t=b.dataset.t;
    if(a==="sleep"){
      sleeping=true;S.mood=cl(S.mood+10);S.health=cl(S.health+5);say("쿨쿨… 잘 자요.");render();
      setTimeout(function(){sleeping=false;say("잘 잤어요! 개운해요.");render();hop();},2200);return;
    }
    act(function(){A[a](t);});
  };
  el("tabs").onclick=function(e){
    var b=e.target.closest("button");if(!b||!b.dataset.p)return;
    S.place=b.dataset.p;say(INTRO[S.place]);render();
  };
  function endDay(){
    var fed=S.food>=3;
    S.day++;S.food=0;S.clean=cl(S.clean-30);
    if(S.clean<30){S.health=cl(S.health-20);}else if(fed){S.health=cl(S.health+5);}
    if(!fed){S.mood=cl(S.mood-20);}
    if(S.health<40){say("몸이 안 좋아요… 병원에 데려가 주세요.");}
    else if(S.clean<30){say("몸이 더러워요. 목욕탕에 가요!");}
    else if(!fed){say(S.mood<30?"흥, 어제 밥을 못 먹어서 삐졌어요…":"배고파요… 어제는 밥을 다 못 먹었어요.");}
    else{say("좋은 아침! "+S.day+"일째예요. 오늘도 밥 먹고 싶어요.");}
  }
  var DAY=86400000;
  function tick(){
    var now=Date.now();
    if(!S.started)return false;
    if(!S.dayStart){S.dayStart=now;return false;}
    var n=Math.floor((now-S.dayStart)/DAY);
    if(n<1)return false;
    var k=Math.min(3,n);
    for(var i=0;i<k;i++)endDay();
    S.dayStart=n>3?now:S.dayStart+n*DAY;
    return true;
  }
  function showRemain(){
    var m=Math.max(0,Math.ceil((S.dayStart+DAY-Date.now())/60000));
    el("remain").textContent="다음 하루까지 "+Math.floor(m/60)+"시간 "+(m%60)+"분 남음";
  }
  el("next").onclick=function(){act(function(){endDay();S.dayStart=Date.now();});};
  setInterval(function(){if(tick())render();showRemain();},30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){if(tick())render();showRemain();}});
  el("reset").onclick=function(){
    if(confirm("처음부터 다시 시작할까요?")){S=JSON.parse(JSON.stringify(DEF));sleeping=false;buildStart();render();}
  };
  buildStart();tick();render();showRemain();
})();
</script>
